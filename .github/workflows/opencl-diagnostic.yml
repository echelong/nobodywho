name: OpenCL Loader Diagnostic

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device to compare both loader paths on
        type: choice
        default: s24ultra-adreno
        options: [s24ultra-adreno, pixel8-mali, both]
  workflow_call:
    inputs:
      device:
        type: string
        default: s24ultra-adreno
    secrets:
      GCP_SERVICE_ACCOUNT:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, embedded]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - uses: ./.github/actions/prepare-android-gpu
        with:
          target: aarch64-linux-android
          ndk: ${{ steps.ndk.outputs.ndk-path }}
      - name: Build diagnostic APKs
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          bash nobodywho/testing-apps/opencl-diagnostic/build-native.sh "$PROBE_MODE"
          bash nobodywho/testing-apps/kotlin/gradlew -p nobodywho/testing-apps/opencl-diagnostic assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: opencl-probe-${{ matrix.mode }}
          path: |
            nobodywho/testing-apps/opencl-diagnostic/build/outputs/apk/
            nobodywho/testing-apps/opencl-diagnostic/src/main/jniLibs/
      # Each matrix entry is a separate FTL run: no shared process/loader state.
      - uses: ./.github/actions/run-ftl
        with:
          app-apk: nobodywho/testing-apps/opencl-diagnostic/build/outputs/apk/debug/opencl-diagnostic-debug.apk
          test-apk: nobodywho/testing-apps/opencl-diagnostic/build/outputs/apk/androidTest/debug/opencl-diagnostic-debug-androidTest.apk
          native-lib: libopencl_probe.so
          scenario: ${{ matrix.mode }}
          devices: ${{ inputs.device }}
          test-timeout: 5m
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
