[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nobodywho-decision-router"
version = "0.1.0"
description = "Experimental provider-neutral decision router: TypeSafe JEV or local NobodyWho"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "EUPL-1.2" }
dependencies = []

[project.optional-dependencies]
local = ["nobodywho>=3.0.0"]
# Training/export tools for specialist/; exact recorded pins live in
# specialist/requirements-train.txt.
train = ["torch", "transformers", "peft", "accelerate", "gguf"]
dev = ["pytest>=8", "ruff>=0.15", "ty>=0.0.47"]

[project.scripts]
decision = "decision_router.cli:main"

[project.urls]
Upstream = "https://github.com/nobodywho-ooo/nobodywho"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_router = ["cline_rule.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the local GGUF model (skipped when it is not present)",
]

[tool.ruff]
line-length = 100

[tool.ty.environment]
# The specialist training/verification tools in `specialist/` are standalone
# scripts (not an installed package) whose sibling imports resolve at runtime
# via an explicit sys.path entry. Put that directory on the checker's search
# path too, so their imports are analyzed instead of suppressed.
extra-paths = ["specialist"]
